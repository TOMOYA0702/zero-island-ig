name: Instagram 自動投稿
on:
  schedule:
    # GitHubの定時実行は数時間遅れることがある（11/17・18は約9時間遅れ）。
    # 毎時動かし、日本時間18〜23時台に来た最初の1回だけが投稿する（投稿済みの日は posted.json で止まる）。
    - cron: "10 * * * *"
  push:
    branches: [main]
    paths: [".github/workflows/post.yml", "posts/**/caption.txt"]
  workflow_dispatch:
    inputs:
      date:
        description: "投稿する日（YYYY-MM-DD、空なら今日）"
        required: false
      dry_run:
        description: "確認だけ（投稿しない）なら 1"
        required: false
        default: "1"
concurrency:
  group: ig-post
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 投稿
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          POST_DATE: ${{ github.event.inputs.date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          EVENT: ${{ github.event_name }}
        run: python3 publish.py
      - name: 投稿済みの記録を残す
        run: |
          git config user.name "zero-island-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || (git commit -m "posted $(TZ=Asia/Tokyo date +%F)" && git push)
