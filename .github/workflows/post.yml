name: Instagram 自動投稿
on:
  schedule:
    # 毎日 18:45 JST から予備を含めて4回起動。GitHubの定時実行は遅れたり飛ばされたりするため。
    # 投稿済みの日は posted.json で止まるので、二重投稿はしない。
    - cron: "45 9 * * *"
    - cron: "5 10 * * *"
    - cron: "25 10 * * *"
    - cron: "50 10 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "投稿する日（YYYY-MM-DD、空なら今日）"
        required: false
      dry_run:
        description: "確認だけ（投稿しない）なら 1"
        required: false
        default: "1"
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 投稿
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          POST_DATE: ${{ github.event.inputs.date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          EVENT: ${{ github.event_name }}
        run: python3 publish.py
      - name: 投稿済みの記録を残す
        run: |
          git config user.name "zero-island-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || (git commit -m "posted $(TZ=Asia/Tokyo date +%F)" && git push)
