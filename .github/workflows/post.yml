name: Instagram 自動投稿
on:
  schedule:
    - cron: "45 9 * * *"   # 毎日 18:45 JST に起動（GitHubの混雑で数分〜十数分遅れるため、19:00前後に投稿）
  workflow_dispatch:
    inputs:
      date:
        description: "投稿する日（YYYY-MM-DD、空なら今日）"
        required: false
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 投稿
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          POST_DATE: ${{ github.event.inputs.date }}
        run: python3 publish.py
      - name: 投稿済みの記録を残す
        run: |
          git config user.name "zero-island-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || (git commit -m "posted $(date +%F)" && git push)
